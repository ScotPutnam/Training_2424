<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flash Cards — QEA Interview (Weeks 1–6)</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent-2: #a78bfa;
    --border: #334155;
    --success: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
    max-width: 800px;
    width: 100%;
  }
  h1 {
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 32px;
  }
  .subtitle { color: var(--muted); margin: 0; }
  .top-nav { margin-top: 16px; }
  .top-nav a {
    color: var(--accent);
    text-decoration: none;
    margin: 0 8px;
    font-size: 14px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    justify-content: center;
  }
  .controls button, .controls select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button:hover { background: var(--border); }
  .controls select { padding-right: 32px; }
  .deck-btn.active {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
  }
  .progress-bar {
    width: 100%;
    max-width: 700px;
    height: 6px;
    background: var(--panel);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s;
  }
  .card-wrapper {
    perspective: 1200px;
    width: 100%;
    max-width: 700px;
    height: 380px;
    margin-bottom: 20px;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow-y: auto;
  }
  .card-face.back {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, #1e293b, #312e81);
  }
  .card-face .label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card-face .category {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 12px;
    color: var(--accent);
    background: rgba(96, 165, 250, 0.15);
    padding: 4px 10px;
    border-radius: 12px;
  }
  .card-face .content {
    font-size: 20px;
    line-height: 1.5;
    max-height: 100%;
    overflow-y: auto;
  }
  .card-face code {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 0.9em;
  }
  .card-face pre {
    background: rgba(0,0,0,0.4);
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    font-size: 13px;
    overflow-x: auto;
    max-width: 100%;
  }
  .nav-btns {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .nav-btns button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .nav-btns button:hover { transform: translateY(-2px); }
  .nav-btns button:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
  }
  .rating-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .rating-btns button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  .rating-btns .again { background: var(--danger); color: white; }
  .rating-btns .good { background: var(--success); color: white; }
  .status {
    color: var(--muted);
    font-size: 14px;
  }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 8px;
    font-size: 13px;
  }
  .stats .stat { color: var(--muted); }
  .stats .known { color: var(--success); }
  .stats .review { color: var(--danger); }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Flash Cards</h1>
  <p class="subtitle">Weeks 1–6 · Java · Python · SQL · QEA · Unit Testing</p>
  <div class="top-nav">
    <a href="index.html">Home</a> ·
    <a href="study-guide.html">Study Guide</a> ·
    <a href="quiz.html">Quiz</a>
  </div>
</header>

<div class="controls">
  <button class="deck-btn active" data-deck="all">All</button>
  <button class="deck-btn" data-deck="java">Java</button>
  <button class="deck-btn" data-deck="python">Python</button>
  <button class="deck-btn" data-deck="sql">SQL</button>
  <button class="deck-btn" data-deck="qea">QEA</button>
  <button class="deck-btn" data-deck="testing">Testing (W6)</button>
  <button id="shuffleBtn">🔀 Shuffle</button>
  <button id="resetBtn">↻ Reset</button>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="card-wrapper">
  <div class="card" id="card">
    <div class="card-face front">
      <span class="label">Question</span>
      <span class="category" id="frontCategory"></span>
      <div class="content" id="frontContent"></div>
    </div>
    <div class="card-face back">
      <span class="label">Answer</span>
      <span class="category" id="backCategory"></span>
      <div class="content" id="backContent"></div>
    </div>
  </div>
</div>

<div class="rating-btns" id="ratingBtns" style="display:none;">
  <button class="again" onclick="rate('again')">Need Review</button>
  <button class="good" onclick="rate('good')">Got It ✓</button>
</div>

<div class="nav-btns">
  <button id="prevBtn" onclick="prev()">← Prev</button>
  <button id="flipBtn" onclick="flip()">Flip</button>
  <button id="nextBtn" onclick="next()">Next →</button>
</div>

<div class="status" id="status">Card 1 of ?</div>
<div class="stats">
  <span class="stat known">Known: <span id="knownCount">0</span></span>
  <span class="stat review">To review: <span id="reviewCount">0</span></span>
</div>
<p class="hint">Tip: press <b>Space</b> to flip, <b>←/→</b> to navigate, <b>1</b> to mark review, <b>2</b> to mark known.</p>

<script>
const CARDS = [
  // ===== JAVA — BASICS =====
  { deck:"java", cat:"Java Basics", q:"What is the JVM?", a:"Java Virtual Machine — executes compiled Java bytecode (<code>.class</code>) on any platform." },
  { deck:"java", cat:"Java Basics", q:"JDK vs JRE vs JVM?", a:"<b>JDK</b> = compiler + tools + JRE. <b>JRE</b> = JVM + core libraries. <b>JVM</b> = runs bytecode." },
  { deck:"java", cat:"Java Basics", q:"How many primitive types does Java have?", a:"8: <code>byte, short, int, long, float, double, char, boolean</code>." },
  { deck:"java", cat:"Java Basics", q:"Default value of a <code>boolean</code> instance field?", a:"<code>false</code>. Local variables have no default and must be assigned before use." },
  { deck:"java", cat:"Java Basics", q:"Difference between <code>==</code> and <code>.equals()</code>?", a:"<code>==</code> compares references (or primitives). <code>.equals()</code> compares logical/value equality when properly overridden." },

  // ===== JAVA — ARRAYS =====
  { deck:"java", cat:"Arrays", q:"How do you get the length of an array?", a:"<code>arr.length</code> — a public final <b>field</b>, not a method. Cannot be reassigned." },
  { deck:"java", cat:"Arrays", q:"Can an array be resized once created?", a:"No. Length is fixed at creation. Use <code>ArrayList</code> for a growable list." },
  { deck:"java", cat:"Arrays", q:"How do you correctly compare the contents of two arrays?", a:"<code>Arrays.equals(a, b)</code>. Using <code>==</code> only compares references." },
  { deck:"java", cat:"Arrays", q:"What happens at <code>arr[arr.length]</code>?", a:"Throws <code>ArrayIndexOutOfBoundsException</code>. Valid indices are 0 to length−1." },

  // ===== JAVA — OOP =====
  { deck:"java", cat:"OOP", q:"Name the 4 pillars of OOP.", a:"<b>Encapsulation, Abstraction, Inheritance, Polymorphism.</b>" },
  { deck:"java", cat:"OOP", q:"What is encapsulation?", a:"Bundling data with the methods that operate on it, and hiding internal state behind accessors (private fields + public getters/setters)." },
  { deck:"java", cat:"OOP", q:"What is abstraction?", a:"Exposing <i>what</i> an object does while hiding <i>how</i>. In Java, achieved via interfaces and abstract classes." },
  { deck:"java", cat:"OOP", q:"What is inheritance?", a:"An 'is-a' relationship where a subclass inherits members of its superclass. Java: single-class inheritance via <code>extends</code>." },
  { deck:"java", cat:"OOP", q:"What is polymorphism?", a:"One interface, many implementations. Compile-time (overloading) or runtime (overriding / dynamic dispatch)." },

  // ===== JAVA — MODIFIERS =====
  { deck:"java", cat:"Modifiers", q:"List the 4 access levels in Java (widest → narrowest).", a:"<code>public</code> → <code>protected</code> → default/package-private → <code>private</code>." },
  { deck:"java", cat:"Modifiers", q:"Which classes can see a <code>protected</code> member?", a:"Anything in the same package + any subclass in any package." },
  { deck:"java", cat:"Modifiers", q:"What does <code>final</code> mean on a variable, method, and class?", a:"Variable: value cannot change (constant). Method: cannot be overridden. Class: cannot be extended." },
  { deck:"java", cat:"Modifiers", q:"What does <code>static</code> mean?", a:"Member belongs to the class itself, not to any instance. Shared by all instances. Called via <code>ClassName.member</code>." },
  { deck:"java", cat:"Modifiers", q:"What does <code>transient</code> do?", a:"Marks a field to be skipped by default Java serialization." },

  // ===== JAVA — MEMORY =====
  { deck:"java", cat:"Memory", q:"Where do objects live in the JVM?", a:"On the <b>heap</b>, shared across threads, managed by the garbage collector." },
  { deck:"java", cat:"Memory", q:"Where do local variables and method call frames live?", a:"On the <b>stack</b> — one stack per thread, LIFO." },
  { deck:"java", cat:"Memory", q:"What causes <code>StackOverflowError</code>?", a:"Too-deep (usually infinite) recursion pushing more frames than the thread stack can hold." },
  { deck:"java", cat:"Memory", q:"When is an object eligible for garbage collection?", a:"When there are no reachable references to it from any GC root (thread stacks, statics, JNI handles)." },
  { deck:"java", cat:"Memory", q:"Can you force garbage collection?", a:"No. <code>System.gc()</code> is only a <i>hint</i>. The JVM decides when to run." },

  // ===== JAVA — CLASSES =====
  { deck:"java", cat:"Classes", q:"Class vs Object?", a:"A <b>class</b> is a blueprint/template. An <b>object</b> is a concrete instance created with <code>new</code>." },
  { deck:"java", cat:"Classes", q:"What is a constructor?", a:"A special method with no return type, same name as the class, used to initialize new objects. Default no-arg constructor is generated only if you write none." },
  { deck:"java", cat:"Classes", q:"What does <code>super()</code> do?", a:"Calls the superclass constructor. Must be the first statement in a child constructor; inserted implicitly if omitted." },

  // ===== JAVA — INHERITANCE / POLYMORPHISM =====
  { deck:"java", cat:"Overriding", q:"Overloading vs Overriding — one-line difference?", a:"<b>Overloading</b>: same method name, different parameters, same class, resolved at compile time. <b>Overriding</b>: same signature, subclass, resolved at runtime." },
  { deck:"java", cat:"Overriding", q:"What does <code>@Override</code> do?", a:"Compiler check — fails the build if the method doesn't actually override a parent method. Optional but strongly recommended." },
  { deck:"java", cat:"Casting", q:"Upcast vs downcast — which needs an explicit cast?", a:"Upcast (child → parent) is implicit and always safe. Downcast (parent → child) is explicit and can throw <code>ClassCastException</code>." },
  { deck:"java", cat:"Casting", q:"How can you safely downcast?", a:"Test first: <code>if (a instanceof Dog d) d.fetch();</code> (Java 16+ pattern matching)." },

  // ===== JAVA — ABSTRACT / INTERFACE =====
  { deck:"java", cat:"Abstract vs Interface", q:"Abstract class vs interface — main difference?", a:"Abstract classes can have state and constructors; a class extends only one. Interfaces are pure contracts (only <code>public static final</code> state); a class can implement many." },
  { deck:"java", cat:"Abstract vs Interface", q:"Can an interface have method bodies?", a:"Yes — since Java 8, <code>default</code> and <code>static</code> methods; since Java 9, <code>private</code> helpers." },
  { deck:"java", cat:"Abstract vs Interface", q:"Can you instantiate an abstract class?", a:"No. You can only instantiate a concrete subclass. But you can hold a reference of the abstract type." },

  // ===== JAVA — OBJECT / EQUALS =====
  { deck:"java", cat:"Object class", q:"What's the parent of every Java class?", a:"<code>java.lang.Object</code>." },
  { deck:"java", cat:"Object class", q:"The equals/hashCode contract?", a:"If <code>a.equals(b)</code> is true, then <code>a.hashCode() == b.hashCode()</code>. Violating this breaks hash-based collections." },
  { deck:"java", cat:"Object class", q:"Name three methods every Java object has.", a:"<code>equals(), hashCode(), toString()</code> (also <code>getClass, clone, wait, notify</code>)." },

  // ===== JAVA — EXCEPTIONS =====
  { deck:"java", cat:"Exceptions", q:"Checked vs unchecked exception?", a:"<b>Checked</b> extends <code>Exception</code> — must be declared or handled. <b>Unchecked</b> extends <code>RuntimeException</code> — no such requirement." },
  { deck:"java", cat:"Exceptions", q:"Give 3 unchecked (runtime) exceptions.", a:"<code>NullPointerException</code>, <code>IllegalArgumentException</code>, <code>ClassCastException</code>, <code>ArrayIndexOutOfBoundsException</code>, <code>ArithmeticException</code>." },
  { deck:"java", cat:"Exceptions", q:"Exception vs Error?", a:"<b>Exception</b> — recoverable, application-level. <b>Error</b> — serious JVM/system-level (<code>OutOfMemoryError</code>, <code>StackOverflowError</code>); don't catch." },
  { deck:"java", cat:"Exceptions", q:"When does the <code>finally</code> block run?", a:"Always — whether or not an exception was thrown, and even after a <code>return</code> in try/catch. (Skipped only on JVM crash or <code>System.exit()</code>.)" },
  { deck:"java", cat:"Exceptions", q:"What is try-with-resources?", a:"<code>try (Resource r = ...) { ... }</code> — automatically calls <code>close()</code> on any resource implementing <code>AutoCloseable</code>." },
  { deck:"java", cat:"Exceptions", q:"How do you create a custom checked exception?", a:"Extend <code>Exception</code>. For unchecked, extend <code>RuntimeException</code>. Add a constructor that delegates to super." },

  // ===== JAVA — WRAPPERS =====
  { deck:"java", cat:"Wrappers", q:"Why do wrapper classes exist?", a:"Generics only work with reference types (<code>List&lt;int&gt;</code> is illegal). Wrappers let primitives participate in the collections framework." },
  { deck:"java", cat:"Wrappers", q:"What is autoboxing?", a:"Automatic conversion between a primitive and its wrapper: <code>Integer i = 5;</code> and <code>int x = i;</code>." },
  { deck:"java", cat:"Wrappers", q:"Gotcha comparing boxed Integers with <code>==</code>?", a:"Integer cache is only [−128, 127]. Outside that range, <code>Integer.valueOf(200) == Integer.valueOf(200)</code> is <code>false</code>. Use <code>.equals()</code>." },

  // ===== JAVA — COLLECTIONS =====
  { deck:"java", cat:"Collections", q:"Root interface of the collections framework?", a:"<code>java.util.Collection</code>. <code>Map</code> is a <i>separate</i> hierarchy, not a Collection." },
  { deck:"java", cat:"Collections", q:"Three main sub-interfaces of Collection?", a:"<code>List</code> (ordered, duplicates), <code>Set</code> (no duplicates), <code>Queue</code> (FIFO/priority)." },
  { deck:"java", cat:"Collections", q:"ArrayList vs LinkedList — random access?", a:"ArrayList: O(1) random access. LinkedList: O(n) — must walk the chain." },
  { deck:"java", cat:"Collections", q:"ArrayList vs LinkedList — insertion in the middle?", a:"ArrayList: O(n) to shift elements. LinkedList: O(n) to find + O(1) to rewire." },
  { deck:"java", cat:"Collections", q:"HashMap vs Hashtable?", a:"HashMap: not synchronized, allows one null key + null values. Hashtable: legacy synchronized, no nulls. For concurrency use <code>ConcurrentHashMap</code>." },
  { deck:"java", cat:"Collections", q:"HashSet vs TreeSet?", a:"HashSet: unordered, O(1) add/contains, allows one null. TreeSet: sorted, O(log n), no nulls." },
  { deck:"java", cat:"Collections", q:"What's a PriorityQueue?", a:"A min-heap based queue where <code>poll()</code> always returns the smallest element per natural ordering or a supplied <code>Comparator</code>. Not FIFO, not sorted iteration." },
  { deck:"java", cat:"Collections", q:"What's the modern replacement for <code>Stack</code>?", a:"<code>Deque&lt;T&gt; stack = new ArrayDeque&lt;&gt;();</code> — use <code>push/pop/peek</code>. Faster and non-legacy." },
  { deck:"java", cat:"Collections", q:"Big-O of <code>HashMap.get()</code>?", a:"O(1) average, O(log n) worst case (Java 8+ converts long collision chains to a red-black tree)." },

  // ===== JAVA — LAMBDAS =====
  { deck:"java", cat:"Lambdas", q:"What is a functional interface?", a:"An interface with exactly one abstract method (<code>@FunctionalInterface</code>). It can be implemented with a lambda." },
  { deck:"java", cat:"Lambdas", q:"Functional interface for T → R?", a:"<code>Function&lt;T,R&gt;</code> — <code>R apply(T t)</code>." },
  { deck:"java", cat:"Lambdas", q:"Functional interface for T → boolean?", a:"<code>Predicate&lt;T&gt;</code> — <code>boolean test(T t)</code>." },
  { deck:"java", cat:"Lambdas", q:"Functional interface for T → void?", a:"<code>Consumer&lt;T&gt;</code> — <code>void accept(T t)</code>." },
  { deck:"java", cat:"Lambdas", q:"Functional interface for () → T?", a:"<code>Supplier&lt;T&gt;</code> — <code>T get()</code>." },
  { deck:"java", cat:"Lambdas", q:"Give an example of a method reference.", a:"<code>String::length</code>, <code>System.out::println</code>, <code>ArrayList::new</code>." },

  // ===== JAVA — I/O =====
  { deck:"java", cat:"File I/O", q:"Modern way to read all lines of a small file?", a:"<code>Files.readAllLines(Paths.get(\"data.txt\"));</code>" },
  { deck:"java", cat:"File I/O", q:"Best way to read a large file line-by-line?", a:"Stream it: <code>try (Stream&lt;String&gt; s = Files.lines(path)) { s.forEach(...); }</code>" },

  // ===== JAVA — LOGGING =====
  { deck:"java", cat:"Logging", q:"Logback levels from least to most severe?", a:"<b>TRACE, DEBUG, INFO, WARN, ERROR</b>." },
  { deck:"java", cat:"Logging", q:"Why use parameterized log messages <code>log.info(\"user {}\", id)</code>?", a:"SLF4J skips the string concatenation if that level is disabled — much cheaper than <code>\"user \" + id</code>." },

  // ===== JAVA — WEEK 2 FOUNDATIONS =====
  { deck:"java", cat:"Compilation", q:"What does <code>javac</code> produce from a <code>.java</code> file?", a:"<b>Bytecode</b> in a <code>.class</code> file, which the JVM loads and executes — the basis of 'write once, run anywhere'." },
  { deck:"java", cat:"Compilation", q:"Write the exact signature of the Java entry point.", a:"<code>public static void main(String[] args)</code> — public so the JVM can call it, static so no object is needed, void return, String array of CLI args." },
  { deck:"java", cat:"Maven", q:"What file configures a Maven project?", a:"<code>pom.xml</code> — the <b>Project Object Model</b>: coordinates, dependencies, plugins, build config." },
  { deck:"java", cat:"Maven", q:"What are Maven coordinates?", a:"<code>groupId : artifactId : version</code> — uniquely identify an artifact in a repository (e.g. Maven Central)." },
  { deck:"java", cat:"Maven", q:"Order of the main Maven default lifecycle phases?", a:"<b>validate → compile → test → package → verify → install → deploy</b>. Running a phase runs all earlier ones too." },
  { deck:"java", cat:"Maven", q:"Where does production code vs test code live in a Maven project?", a:"<code>src/main/java</code> for production, <code>src/test/java</code> for tests. Build output goes to <code>target/</code>." },
  { deck:"java", cat:"Strings", q:"Why does <code>\"hi\" == \"hi\"</code> return true but <code>new String(\"hi\") == \"hi\"</code> return false?", a:"String <b>literals</b> are interned in the string pool (same object). <code>new</code> forces a separate heap object. Always compare with <code>.equals()</code>." },
  { deck:"java", cat:"Strings", q:"What does it mean that String is immutable?", a:"Its characters can never change — methods like <code>toUpperCase()</code> return a <b>new</b> String. Enables pooling, thread-safety, and safe map keys." },
  { deck:"java", cat:"Strings", q:"Best tool for building a String in a loop?", a:"<code>StringBuilder</code> — <code>append()</code> then <code>toString()</code>. Repeated <code>+</code> creates a new String each iteration (O(n²))." },
  { deck:"java", cat:"Scanner", q:"Classic Scanner gotcha after <code>nextInt()</code>?", a:"It leaves the newline in the buffer, so a following <code>nextLine()</code> returns \"\". Fix: add an extra <code>nextLine()</code> after numeric reads." },
  { deck:"java", cat:"Algorithms", q:"Time complexity of linear vs binary search?", a:"Linear: <b>O(n)</b>, works on anything. Binary: <b>O(log n)</b>, requires <b>sorted</b> data." },
  { deck:"java", cat:"Algorithms", q:"What does binary search do each iteration?", a:"Compares the target to the middle element and discards half the remaining range (adjust lo/hi around mid)." },
  { deck:"java", cat:"Algorithms", q:"Order these fastest → slowest: O(n²), O(1), O(n log n), O(log n), O(n)", a:"<b>O(1) → O(log n) → O(n) → O(n log n) → O(n²)</b>." },
  { deck:"java", cat:"SOLID", q:"What does SOLID stand for?", a:"<b>S</b>ingle Responsibility, <b>O</b>pen/Closed, <b>L</b>iskov Substitution, <b>I</b>nterface Segregation, <b>D</b>ependency Inversion." },
  { deck:"java", cat:"SOLID", q:"State the Open/Closed principle.", a:"Software entities should be <b>open for extension but closed for modification</b> — add behavior via new subclasses/implementations, not by editing working code." },
  { deck:"java", cat:"SOLID", q:"State the Liskov Substitution principle.", a:"A subclass must be usable anywhere its parent type is expected without breaking behavior." },
  { deck:"java", cat:"Debugging", q:"How do you read a stack trace?", a:"Top line = exception + message. Read frames top-down; the first frame in <b>your</b> package is usually the culprit. <code>Caused by:</code> shows the root cause." },
  { deck:"java", cat:"Debugging", q:"Step over vs step into?", a:"<b>Step over</b> executes the current line and stops at the next. <b>Step into</b> enters the method being called on that line." },

  // ================================================
  // ============== SQL =============================
  // ================================================
  { deck:"sql", cat:"SQL Basics", q:"What does SQL stand for?", a:"<b>Structured Query Language</b> — the declarative language for relational databases." },
  { deck:"sql", cat:"SQL Basics", q:"What are the 5 categories of SQL statements?", a:"<b>DDL, DML, DQL, DCL, TCL</b> (Definition, Manipulation, Query, Control, Transaction)." },
  { deck:"sql", cat:"SQL Basics", q:"Give an example of a database vendor known for JSON/extensibility.", a:"<b>PostgreSQL</b> — rich types (JSONB, arrays, ranges), extensions, standards-compliant." },
  { deck:"sql", cat:"SQL Basics", q:"Which database is embedded (single file, no server)?", a:"<b>SQLite</b>." },

  // ===== DDL =====
  { deck:"sql", cat:"DDL", q:"Name the DDL keywords.", a:"<code>CREATE, ALTER, DROP, TRUNCATE, RENAME</code>." },
  { deck:"sql", cat:"DDL", q:"DELETE vs TRUNCATE vs DROP — table structure survives?", a:"DELETE: yes (removes rows). TRUNCATE: yes (removes all rows fast). DROP: no (removes table itself)." },
  { deck:"sql", cat:"DDL", q:"Which category is TRUNCATE?", a:"<b>DDL</b>. That's why it usually can't be rolled back and doesn't fire row triggers." },

  // ===== DML =====
  { deck:"sql", cat:"DML", q:"Name the DML keywords.", a:"<code>INSERT, UPDATE, DELETE, MERGE</code>." },
  { deck:"sql", cat:"DML", q:"What must you always include on UPDATE/DELETE (unless intended)?", a:"A <code>WHERE</code> clause — otherwise you affect every row." },

  // ===== DQL / SELECT =====
  { deck:"sql", cat:"DQL", q:"Logical order of SELECT clauses?", a:"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT." },
  { deck:"sql", cat:"DQL", q:"WHERE vs HAVING?", a:"WHERE filters <i>rows</i> before grouping (no aggregates). HAVING filters <i>groups</i> after GROUP BY (aggregates allowed)." },
  { deck:"sql", cat:"DQL", q:"How do you get distinct values?", a:"<code>SELECT DISTINCT column FROM table;</code>" },
  { deck:"sql", cat:"DQL", q:"Common aggregate functions?", a:"<code>COUNT(), SUM(), AVG(), MIN(), MAX()</code>." },

  // ===== DCL / TCL =====
  { deck:"sql", cat:"DCL", q:"Name the DCL keywords.", a:"<code>GRANT</code> and <code>REVOKE</code>." },
  { deck:"sql", cat:"TCL", q:"Name the TCL keywords.", a:"<code>BEGIN/START TRANSACTION, COMMIT, ROLLBACK, SAVEPOINT</code>." },
  { deck:"sql", cat:"TCL", q:"What does SAVEPOINT let you do?", a:"Mark a point inside a transaction you can <code>ROLLBACK TO</code> without aborting the entire transaction." },

  // ===== CONSTRAINTS =====
  { deck:"sql", cat:"Constraints", q:"List the six main SQL constraints.", a:"<b>NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK, DEFAULT.</b>" },
  { deck:"sql", cat:"Constraints", q:"What does PRIMARY KEY imply?", a:"NOT NULL + UNIQUE + only one per table. Identifies each row uniquely." },
  { deck:"sql", cat:"Constraints", q:"Difference between UNIQUE and PRIMARY KEY?", a:"UNIQUE allows one NULL and there can be multiple UNIQUE constraints. PRIMARY KEY disallows NULL and there's only one per table." },

  // ===== NORMALIZATION =====
  { deck:"sql", cat:"Normalization", q:"What is 1NF?", a:"Atomic column values (no repeating groups / lists in a cell) and each row uniquely identifiable." },
  { deck:"sql", cat:"Normalization", q:"What is 2NF?", a:"1NF + every non-key column depends on the <i>entire</i> primary key (no partial dependencies on composite keys)." },
  { deck:"sql", cat:"Normalization", q:"What is 3NF?", a:"2NF + no transitive dependencies — non-key columns must depend only on the key, not on other non-key columns." },
  { deck:"sql", cat:"Normalization", q:"Why normalize?", a:"Reduce redundancy, prevent update/insert/delete anomalies, keep data consistent." },

  // ===== RELATIONSHIPS =====
  { deck:"sql", cat:"Relationships", q:"How do you model a many-to-many relationship?", a:"With a <b>junction (bridge) table</b> holding foreign keys to both sides." },
  { deck:"sql", cat:"Relationships", q:"In one-to-many, which side holds the foreign key?", a:"The <b>many</b> side. E.g., <code>employee.department_id → department.id</code>." },
  { deck:"sql", cat:"Referential Integrity", q:"What does ON DELETE CASCADE do?", a:"When the referenced parent row is deleted, matching child rows are automatically deleted too." },

  // ===== ACID =====
  { deck:"sql", cat:"ACID", q:"What does ACID stand for?", a:"<b>Atomicity, Consistency, Isolation, Durability.</b>" },
  { deck:"sql", cat:"ACID", q:"What is Atomicity?", a:"All statements in a transaction succeed together, or none do." },
  { deck:"sql", cat:"ACID", q:"What is Isolation?", a:"Concurrent transactions don't interfere with each other. Governed by isolation levels." },
  { deck:"sql", cat:"ACID", q:"What is Durability?", a:"Once a transaction commits, its changes survive crashes (typically via a write-ahead log)." },
  { deck:"sql", cat:"ACID", q:"Highest and lowest SQL isolation levels?", a:"Lowest: <code>READ UNCOMMITTED</code>. Highest: <code>SERIALIZABLE</code>." },
  { deck:"sql", cat:"ACID", q:"What is a dirty read?", a:"Reading uncommitted data from another transaction that may later roll back." },

  // ===== JOINS =====
  { deck:"sql", cat:"Joins", q:"INNER JOIN — what does it return?", a:"Only rows with a match in <b>both</b> tables." },
  { deck:"sql", cat:"Joins", q:"LEFT JOIN — what does it return?", a:"All rows from the left table + matching right rows (or NULLs where none matched)." },
  { deck:"sql", cat:"Joins", q:"CROSS JOIN — what does it return?", a:"The Cartesian product — every row from the left combined with every row from the right. No ON clause." },
  { deck:"sql", cat:"Joins", q:"FULL OUTER JOIN — what does it return?", a:"All rows from both tables; NULLs on either side where no match." },
  { deck:"sql", cat:"Joins", q:"What's a self-join?", a:"Joining a table to itself, using table aliases. Useful for hierarchical data (e.g., employee → manager)." },

  // ===== SET OPS =====
  { deck:"sql", cat:"Set Ops", q:"UNION vs UNION ALL?", a:"UNION removes duplicates (extra sort/hash). UNION ALL keeps them (faster)." },
  { deck:"sql", cat:"Set Ops", q:"What does INTERSECT return?", a:"Only rows appearing in both result sets." },
  { deck:"sql", cat:"Set Ops", q:"What does EXCEPT (MINUS) return?", a:"Rows in the first result set that are <b>not</b> in the second." },

  // ===== INDEXES =====
  { deck:"sql", cat:"Indexes", q:"What is a database index?", a:"An auxiliary data structure (usually B-tree) that speeds up lookups on indexed columns at the cost of extra storage and slower writes." },
  { deck:"sql", cat:"Indexes", q:"Trade-off of adding an index?", a:"Faster SELECTs but slower INSERT/UPDATE/DELETE (index must be maintained) and extra disk space." },
  { deck:"sql", cat:"Indexes", q:"Clustered vs non-clustered index?", a:"<b>Clustered</b>: rows physically stored in index order (one per table). <b>Non-clustered</b>: separate structure pointing to rows (many allowed)." },
  { deck:"sql", cat:"Indexes", q:"What's a composite index and the leftmost-prefix rule?", a:"An index on multiple columns. Queries can only use it if they filter on a leading prefix of those columns (e.g., <code>(a,b,c)</code> helps queries on <code>a</code> or <code>a,b</code> — not on <code>b</code> alone)." },

  // ===== VIEWS =====
  { deck:"sql", cat:"Views", q:"What is a view?", a:"A stored SELECT query treated as a virtual table. It doesn't store data — it re-runs the query when queried." },
  { deck:"sql", cat:"Views", q:"Advantages of a view?", a:"Query reuse, abstraction from schema, security (grant on view instead of raw tables), simpler API to callers." },
  { deck:"sql", cat:"Views", q:"View vs materialized view?", a:"Regular view: re-executes each time. Materialized view: caches rows and needs REFRESH — faster reads, staler data." },

  // ===== STORED PROC =====
  { deck:"sql", cat:"Stored Procedures", q:"What is a stored procedure?", a:"Server-side compiled routine, called with <code>CALL</code>, can take parameters, encapsulate logic, and manage transactions." },
  { deck:"sql", cat:"Stored Procedures", q:"Function vs procedure?", a:"A function must return a value and is usable inside SQL expressions. A procedure is invoked via CALL and can perform TCL (COMMIT/ROLLBACK)." },

  // ===== JDBC =====
  { deck:"sql", cat:"JDBC", q:"What does JDBC stand for?", a:"<b>Java Database Connectivity</b> — standard API in <code>java.sql</code> for talking to relational DBs." },
  { deck:"sql", cat:"JDBC", q:"Name the core JDBC interfaces.", a:"<code>DriverManager, Connection, Statement, PreparedStatement, CallableStatement, ResultSet, SQLException</code>." },
  { deck:"sql", cat:"JDBC", q:"How do you get a JDBC Connection?", a:"<code>DriverManager.getConnection(url, user, pass);</code>" },
  { deck:"sql", cat:"JDBC", q:"Which JDBC method for a SELECT?", a:"<code>executeQuery()</code> — returns a <code>ResultSet</code>." },
  { deck:"sql", cat:"JDBC", q:"Which JDBC method for INSERT/UPDATE/DELETE?", a:"<code>executeUpdate()</code> — returns the row count." },
  { deck:"sql", cat:"JDBC", q:"How do you iterate a ResultSet?", a:"<code>while (rs.next()) { rs.getInt(\"id\"); ... }</code>" },
  { deck:"sql", cat:"JDBC", q:"Why use try-with-resources with JDBC?", a:"Connection, Statement, and ResultSet all implement AutoCloseable — auto-closing prevents leaked DB handles." },
  { deck:"sql", cat:"JDBC", q:"Which exception do JDBC methods throw?", a:"<code>SQLException</code> — a <b>checked</b> exception." },

  // ===== PREPARED STMT =====
  { deck:"sql", cat:"PreparedStatement", q:"Statement vs PreparedStatement — SQL injection?", a:"Statement concatenates strings — vulnerable. PreparedStatement uses <code>?</code> placeholders + setXxx() — safe." },
  { deck:"sql", cat:"PreparedStatement", q:"How do you bind parameters to a PreparedStatement?", a:"<code>ps.setInt(1, 42); ps.setString(2, \"Alice\");</code> — 1-based index." },
  { deck:"sql", cat:"PreparedStatement", q:"Why is PreparedStatement faster in a loop?", a:"The SQL is parsed and compiled once by the DB, then re-executed with different parameters." },

  // ===== DAO =====
  { deck:"sql", cat:"DAO Pattern", q:"What is the DAO pattern?", a:"<b>Data Access Object</b> — an interface abstracting persistence so business code doesn't touch JDBC directly." },
  { deck:"sql", cat:"DAO Pattern", q:"Benefit of DAO?", a:"Swappable persistence implementations (JDBC, JPA, in-memory for tests), single place for SQL, testable business layer." },

  // ===== SQLite / SQLAlchemy =====
  { deck:"sql", cat:"SQLite3", q:"What is SQLite?", a:"An embedded, serverless RDBMS stored in a single file. Great for tests, mobile apps, and small tools." },
  { deck:"sql", cat:"SQLAlchemy", q:"What are the two layers of SQLAlchemy?", a:"<b>Core</b> (SQL Expression Language) and <b>ORM</b> (map classes to tables)." },
  { deck:"sql", cat:"SQLAlchemy", q:"What is a Session in SQLAlchemy?", a:"The ORM's unit-of-work — tracks changes to objects and flushes them as a single transaction on commit." },

  // ================================================
  // ============== PYTHON (WEEKS 1–2) ==============
  // ================================================
  { deck:"python", cat:"Basics", q:"Is Python compiled or interpreted? Statically or dynamically typed?", a:"<b>Interpreted</b> (source → bytecode → Python VM) and <b>dynamically typed</b> — types are checked at runtime and variables can be rebound to any type." },
  { deck:"python", cat:"Collections", q:"List vs tuple — key difference?", a:"Lists are <b>mutable</b>, tuples are <b>immutable</b> (so tuples can be dict keys / set members). Tuple of one element needs a comma: <code>(5,)</code>." },
  { deck:"python", cat:"Collections", q:"What does a set give you that a list doesn't?", a:"<b>No duplicates</b> and O(1) membership tests. Unordered. Create an empty one with <code>set()</code> — <code>{}</code> is an empty <b>dict</b>." },
  { deck:"python", cat:"Collections", q:"How do you read a dict key without risking KeyError?", a:"<code>d.get(\"key\", default)</code> — returns the default (None if omitted) when the key is missing. <code>d[\"key\"]</code> raises KeyError." },
  { deck:"python", cat:"Collections", q:"What does <code>nums[-1]</code> and <code>nums[1:3]</code> return?", a:"<code>[-1]</code> = last element. <code>[1:3]</code> = slice of indices 1 and 2 (end exclusive). Slicing also works on strings." },
  { deck:"python", cat:"Collections", q:"Name three useful members of the <code>collections</code> module.", a:"<code>deque</code> (O(1) append/pop both ends), <code>Counter</code> (frequency map), <code>defaultdict</code> (auto-default for missing keys)." },
  { deck:"python", cat:"Basics", q:"Which values are falsy in Python?", a:"<code>False, None, 0, 0.0, \"\", [], (), {}, set()</code> — empty containers and zero. Everything else is truthy." },
  { deck:"python", cat:"Comprehensions", q:"Write a list comprehension for the squares of even numbers 0–9.", a:"<code>[x**2 for x in range(10) if x % 2 == 0]</code> — pattern: expression <b>for</b> item <b>in</b> iterable <b>if</b> condition." },
  { deck:"python", cat:"Comprehensions", q:"What's the difference between <code>[x*2 for x in data]</code> and <code>(x*2 for x in data)</code>?", a:"Brackets build the whole <b>list</b> in memory now; parentheses create a lazy <b>generator expression</b> that yields values on demand." },
  { deck:"python", cat:"Functions", q:"What do <code>*args</code> and <code>**kwargs</code> collect?", a:"<code>*args</code> — extra positional arguments as a <b>tuple</b>. <code>**kwargs</code> — extra keyword arguments as a <b>dict</b>." },
  { deck:"python", cat:"Functions", q:"Syntax and limits of a lambda?", a:"<code>lambda a, b: a + b</code> — anonymous function containing a <b>single expression</b> (no statements). Common as key functions: <code>sorted(words, key=lambda w: len(w))</code>." },
  { deck:"python", cat:"Functions", q:"What is LEGB?", a:"Name-resolution order: <b>L</b>ocal → <b>E</b>nclosing → <b>G</b>lobal → <b>B</b>uilt-in. Use <code>global</code>/<code>nonlocal</code> to assign to outer scopes." },
  { deck:"python", cat:"Functions", q:"Why is <code>def f(items=[])</code> a bug?", a:"Default values are created <b>once</b> at definition time — the same list is shared across all calls. Use <code>items=None</code> and create inside." },
  { deck:"python", cat:"Functional", q:"What do map() and filter() return?", a:"Lazy <b>iterators</b>, not lists — wrap with <code>list()</code> to materialize. <code>map(fn, xs)</code> transforms; <code>filter(pred, xs)</code> keeps matches." },
  { deck:"python", cat:"Functional", q:"Where does reduce live and what does it do?", a:"<code>from functools import reduce</code> — folds a sequence to one value: <code>reduce(lambda a,b: a+b, nums, 0)</code>." },
  { deck:"python", cat:"Functional", q:"What does <code>zip([1,2], \"ab\")</code> produce?", a:"An iterator of pairs: <code>(1, 'a'), (2, 'b')</code> — stops at the shorter input. Great for building dicts: <code>dict(zip(keys, vals))</code>." },
  { deck:"python", cat:"OOP", q:"What is <code>self</code>?", a:"The instance the method was called on — passed automatically as the first parameter of instance methods." },
  { deck:"python", cat:"OOP", q:"Class attribute vs instance attribute?", a:"Class attribute: defined on the class, <b>shared</b> by all instances. Instance attribute: set on <code>self</code> (usually in <code>__init__</code>), per-object." },
  { deck:"python", cat:"OOP", q:"Which dunder methods control print(), ==, and len()?", a:"<code>__str__</code> (and <code>__repr__</code> for debugging), <code>__eq__</code>, <code>__len__</code>. <code>__init__</code> is the constructor." },
  { deck:"python", cat:"OOP", q:"How does Python do 'private' fields?", a:"By <b>convention</b>: <code>_name</code> = internal, <code>__name</code> = name-mangled to <code>_Class__name</code>. Nothing is enforced like Java's <code>private</code>." },
  { deck:"python", cat:"OOP", q:"How do you call the parent constructor in a subclass?", a:"<code>super().__init__(args)</code> inside the child's <code>__init__</code>." },
  { deck:"python", cat:"Exceptions", q:"Order of try/except/else/finally — when does each run?", a:"<code>try</code> runs; on matching error → <code>except</code>; <code>else</code> only if NO exception; <code>finally</code> <b>always</b>." },
  { deck:"python", cat:"Exceptions", q:"How do you define and raise a custom exception?", a:"<code>class InsufficientFundsError(Exception): pass</code> then <code>raise InsufficientFundsError(\"msg\")</code>. All Python exceptions are unchecked." },
  { deck:"python", cat:"Generators", q:"What makes a function a generator?", a:"Containing <code>yield</code>. Calling it returns a lazy generator; each <code>next()</code> runs to the next yield. Ends by raising <code>StopIteration</code>." },
  { deck:"python", cat:"Generators", q:"Iterable vs iterator?", a:"<b>Iterable</b> can produce an iterator (<code>__iter__</code>). <b>Iterator</b> yields items via <code>__next__</code> until <code>StopIteration</code>. <code>for</code> handles both automatically." },
  { deck:"python", cat:"Decorators", q:"What is a decorator?", a:"A function that takes a function and returns a wrapped version. <code>@timer</code> above <code>def f</code> means <code>f = timer(f)</code>. Flask routes use this pattern." },
  { deck:"python", cat:"Logging", q:"Python logging levels, least → most severe?", a:"<b>DEBUG → INFO → WARNING → ERROR → CRITICAL</b>. Root default is WARNING — configure with <code>logging.basicConfig(level=...)</code>." },

  { deck:"python", cat:"Files", q:"Difference between file modes <code>w</code> and <code>a</code>?", a:"<code>w</code> <b>truncates</b> (erases) existing content before writing. <code>a</code> appends to the end. Both create the file if missing." },
  { deck:"python", cat:"Files", q:"Which file mode errors if the file already exists?", a:"<code>x</code> — exclusive creation. Raises <code>FileExistsError</code> if the file is there." },
  { deck:"python", cat:"Files", q:"read() vs readline() vs readlines()?", a:"<code>read()</code> — whole file as one string. <code>readline()</code> — one line. <code>readlines()</code> — list of all lines. Or iterate the file object line-by-line." },
  { deck:"python", cat:"Files", q:"What guarantee does <code>with open(...) as f:</code> give?", a:"The file's <code>__exit__</code> (context manager) closes it when the block ends — <b>even if an exception is raised</b>." },
  { deck:"python", cat:"Pickling", q:"What is pickling?", a:"Serializing a Python object to a <b>binary</b> byte stream (<code>pickle.dump(obj, f)</code>) and restoring it (<code>pickle.load(f)</code>). Files must be opened in <code>wb</code>/<code>rb</code>." },
  { deck:"python", cat:"Pickling", q:"Security rule for pickle?", a:"<b>Never unpickle untrusted data</b> — loading a pickle can execute arbitrary code. Use JSON for data exchange." },
  { deck:"python", cat:"HTTP", q:"Which HTTP methods map to CRUD?", a:"Create → <b>POST</b>, Read → <b>GET</b>, Update → <b>PUT/PATCH</b>, Delete → <b>DELETE</b>." },
  { deck:"python", cat:"HTTP", q:"What do status codes 200, 201, 400, 404, 500 mean?", a:"<b>200</b> OK · <b>201</b> Created · <b>400</b> Bad Request (client's fault) · <b>404</b> Not Found · <b>500</b> Internal Server Error (server's fault)." },
  { deck:"python", cat:"HTTP", q:"What does it mean that HTTP is stateless?", a:"Each request is independent — the server keeps no memory of previous requests. State is added via cookies, sessions, or tokens." },
  { deck:"python", cat:"Flask", q:"How do you bind a URL to a function in Flask?", a:"A route decorator: <code>@app.get(\"/items\")</code> or <code>@app.route(\"/items\", methods=[\"POST\"])</code> above a view function. Flask turns its return value into the response." },
  { deck:"python", cat:"Flask", q:"How do you read the JSON body of a POST in Flask?", a:"<code>data = request.get_json()</code> (import <code>request</code> from flask). Query params: <code>request.args.get(\"q\")</code>." },
  { deck:"python", cat:"Flask", q:"How do you return a specific status code from a Flask view?", a:"Return a tuple: <code>return jsonify(item), 201</code>." },
  { deck:"python", cat:"Flask", q:"Default host/port for <code>app.run()</code>?", a:"<code>http://127.0.0.1:5000</code>." },
  { deck:"python", cat:"sqlite3", q:"Basic sqlite3 workflow in Python?", a:"<code>connect()</code> → <code>cursor()</code> → <code>execute(sql, params)</code> → <code>commit()</code> (for DML) → <code>fetchone()/fetchall()</code> → <code>close()</code>." },
  { deck:"python", cat:"sqlite3", q:"How do you pass parameters safely to sqlite3?", a:"<code>?</code> placeholders with a tuple: <code>cur.execute(\"... WHERE name = ?\", (name,))</code> — never f-strings (SQL injection)." },
  { deck:"python", cat:"sqlite3", q:"You INSERTed but the row isn't in the DB. Why?", a:"You forgot <code>conn.commit()</code> — sqlite3 runs in a transaction; uncommitted changes are lost on close." },
  { deck:"python", cat:"pytest", q:"How does pytest discover tests?", a:"Files named <code>test_*.py</code> (or <code>*_test.py</code>), functions named <code>test_*</code>. Assertions use plain <code>assert</code>." },
  { deck:"python", cat:"pytest", q:"How do you assert that code raises an exception in pytest?", a:"<code>with pytest.raises(ValueError): shipping_cost(0)</code>" },
  { deck:"python", cat:"pytest", q:"What does statement coverage measure?", a:"The % of code lines executed by the tests (<code>coverage run -m pytest</code> then <code>coverage report</code>). 100% coverage ≠ bug-free." },

  // ================================================
  // ============== QEA (WEEK 5) ====================
  // ================================================
  { deck:"qea", cat:"SDLC", q:"Name the SDLC phases in order.", a:"<b>Planning → Requirements → Design → Implementation → Testing → Deployment → Maintenance</b>." },
  { deck:"qea", cat:"SDLC", q:"Key weakness of Waterfall?", a:"Testing and feedback come <b>late</b>; change is expensive because each phase must finish before the next starts. Best for stable, well-defined, regulated projects." },
  { deck:"qea", cat:"SDLC", q:"Roughly how does the cost of a bug grow by phase?", a:"Requirements $1 → Development $10 → Testing $100 → Production $1000+. Hence <b>shift-left</b>: test early." },
  { deck:"qea", cat:"Agile", q:"The 4 Agile Manifesto values?", a:"Individuals &amp; interactions <b>over</b> processes &amp; tools · Working software <b>over</b> docs · Customer collaboration <b>over</b> contracts · Responding to change <b>over</b> following a plan." },
  { deck:"qea", cat:"Scrum", q:"The 3 Scrum roles?", a:"<b>Product Owner</b> (owns/orders the backlog), <b>Scrum Master</b> (facilitates, removes impediments), <b>Developers</b> (build the increment — includes testers)." },
  { deck:"qea", cat:"Scrum", q:"The 5 Scrum events?", a:"<b>The Sprint</b> (container), <b>Sprint Planning</b>, <b>Daily Scrum</b>, <b>Sprint Review</b>, <b>Sprint Retrospective</b>." },
  { deck:"qea", cat:"Scrum", q:"Timebox of the Daily Scrum, and its purpose?", a:"<b>15 minutes</b> — inspect progress toward the Sprint Goal and adapt the plan. Not a status report to management." },
  { deck:"qea", cat:"Scrum", q:"Sprint Review vs Sprint Retrospective?", a:"<b>Review</b>: inspect the <i>product</i> with stakeholders, adapt the Product Backlog. <b>Retrospective</b>: inspect the <i>process</i>, commit to 1–3 improvements." },
  { deck:"qea", cat:"Scrum", q:"The 3 Scrum artifacts?", a:"<b>Product Backlog</b>, <b>Sprint Backlog</b>, <b>Increment</b> (meeting the Definition of Done)." },
  { deck:"qea", cat:"Stories", q:"Standard user story format?", a:"\"As a <b>&lt;role&gt;</b>, I want <b>&lt;feature&gt;</b>, so that <b>&lt;benefit&gt;</b>\" — plus testable <b>acceptance criteria</b>." },
  { deck:"qea", cat:"Stories", q:"What are story points?", a:"<b>Relative</b> estimates of effort/complexity (often Fibonacci 1,2,3,5,8,13) — not hours. Completed points per sprint = <b>velocity</b>." },
  { deck:"qea", cat:"Stories", q:"On a burndown chart, what does the actual line ABOVE the ideal line mean?", a:"The team is <b>behind schedule</b> — more work remains than planned at that point in the sprint." },
  { deck:"qea", cat:"QA vs QC", q:"QA vs QC in one line each?", a:"<b>QA</b>: process-oriented, <b>prevents</b> defects (standards, reviews). <b>QC</b>: product-oriented, <b>detects</b> defects (testing, inspection)." },
  { deck:"qea", cat:"V&V", q:"Verification vs Validation?", a:"<b>Verification</b>: are we building the product <b>right</b>? (against specs — reviews, static). <b>Validation</b>: are we building the <b>right</b> product? (against user needs — dynamic testing)." },
  { deck:"qea", cat:"Levels", q:"The 4 testing levels, bottom to top?", a:"<b>Unit → Integration → System → Acceptance (UAT)</b>. The pyramid: many unit tests, fewer integration, few E2E." },
  { deck:"qea", cat:"Levels", q:"Regression vs smoke testing?", a:"<b>Regression</b>: re-run existing tests after changes to catch new breakage. <b>Smoke</b>: quick critical-path check that a new build is testable at all." },
  { deck:"qea", cat:"Principles", q:"Testing principle #1?", a:"Testing shows the <b>presence</b> of defects, not their absence — passing tests never prove the software is bug-free." },
  { deck:"qea", cat:"Principles", q:"What is the pesticide paradox?", a:"Re-running the same tests stops finding new bugs — tests must be reviewed and refreshed regularly." },
  { deck:"qea", cat:"Principles", q:"What is defect clustering?", a:"A small number of modules contain most of the defects (Pareto 80/20) — focus testing where bugs concentrate." },
  { deck:"qea", cat:"Principles", q:"What is the absence-of-errors fallacy?", a:"A 99% bug-free system still fails if it doesn't meet user needs — finding/fixing defects alone doesn't guarantee success." },
  { deck:"qea", cat:"Terminology", q:"Error vs defect vs failure?", a:"<b>Error</b>: human mistake → <b>Defect</b> (bug/fault): flaw in the code → <b>Failure</b>: observable wrong behavior when the defect executes." },
  { deck:"qea", cat:"Box Testing", q:"Black-box vs white-box testing?", a:"<b>Black-box</b>: spec-based, no code knowledge (EP, BVA, decision tables). <b>White-box</b>: structure-based, uses code knowledge (statement/branch coverage)." },
  { deck:"qea", cat:"Box Testing", q:"Statement vs branch coverage — which is stronger?", a:"<b>Branch</b> — 100% branch coverage implies 100% statement coverage, not vice versa. Branch requires every decision to go both true and false." },
  { deck:"qea", cat:"Techniques", q:"Equivalence partitioning for an age field accepting 18–65?", a:"Three partitions: &lt;18 (invalid), 18–65 (valid), &gt;65 (invalid) — test <b>one value from each</b>." },
  { deck:"qea", cat:"Techniques", q:"Boundary values (2-value) for a field accepting 18–65?", a:"<b>17, 18, 65, 66</b> — the values on each side of both boundaries, because bugs live at the edges." },
  { deck:"qea", cat:"Techniques", q:"When do you use decision table testing?", a:"When behavior depends on <b>combinations of conditions</b> (business rules). Each column = one rule = one test. n binary conditions → up to 2ⁿ rules." },
  { deck:"qea", cat:"Techniques", q:"When do you use state transition testing?", a:"When behavior depends on <b>history/state</b> (login lockout, order status, cart). Model states, events, transitions; test valid AND invalid transitions." },
  { deck:"qea", cat:"Techniques", q:"What is error guessing?", a:"Experience-based attack on likely weak spots: null/empty input, 0, negatives, boundaries, huge values, special characters." },
  { deck:"qea", cat:"Techniques", q:"What is exploratory testing?", a:"Simultaneous <b>learning, test design, and execution</b> — unscripted but purposeful, often timeboxed into sessions with a charter." },
  { deck:"qea", cat:"Techniques", q:"Positive vs negative testing?", a:"<b>Positive</b>: valid input behaves as specified. <b>Negative</b>: invalid input is rejected gracefully (no crash, clear error)." },
  { deck:"qea", cat:"Artifacts", q:"What is an RTM and why keep one?", a:"<b>Requirements Traceability Matrix</b> — maps each requirement to its test cases. Proves coverage and shows which tests to re-run when a requirement changes." },
  { deck:"qea", cat:"Artifacts", q:"Essential fields of a test case?", a:"ID, title, preconditions, test data, <b>steps</b>, <b>expected result</b>, actual result, pass/fail status, priority." },
  { deck:"qea", cat:"Artifacts", q:"What is data-driven testing?", a:"One parameterized test script executed against a <b>table of inputs and expected outputs</b> (e.g., CSV of coupon codes)." },
  { deck:"qea", cat:"Defects", q:"Minimal defect lifecycle?", a:"<b>New → Assigned → Fixed → Retest → Closed</b>, with <b>Reopened</b> if retest fails. Other exits: Duplicate, Cannot reproduce, Won't fix, Not a defect." },
  { deck:"qea", cat:"Defects", q:"Severity vs priority?", a:"<b>Severity</b> = technical impact (set by tester). <b>Priority</b> = business urgency (set by PO at triage). They're independent." },
  { deck:"qea", cat:"Defects", q:"Example of LOW severity but HIGH priority?", a:"Broken company logo on the homepage right before a public launch — trivial functionally, urgent for the business." },
  { deck:"qea", cat:"Defects", q:"Example of HIGH severity but LOW priority?", a:"Server crash in an internal admin tool that only staff can trigger via input already blocked in the UI." },
  { deck:"qea", cat:"Manual vs Auto", q:"What should you automate first?", a:"Stable, high-repetition paths: regression suites, smoke tests, data-driven cases. Keep exploratory/usability testing manual." },
  { deck:"qea", cat:"Jira", q:"Jira issue-type hierarchy?", a:"<b>Epic → Story / Task / Bug → Sub-task</b>." },
  { deck:"qea", cat:"Jira", q:"What is a Jira workflow?", a:"The set of <b>statuses</b> (To Do → In Progress → In Review → Done) and <b>transitions</b> an issue moves through; visualized on Scrum/Kanban boards." },

  // ================================================
  // ========== UNIT TESTING (WEEK 6) ===============
  // ================================================
  { deck:"testing", cat:"Unit Testing", q:"What is a unit test?", a:"A test verifying a small, <b>isolated</b> piece of code — typically one method/function — with no external dependencies. Fast (milliseconds) and the base of the testing pyramid." },
  { deck:"testing", cat:"Unit Testing", q:"What does FIRST stand for?", a:"<b>F</b>ast · <b>I</b>solated/Independent · <b>R</b>epeatable · <b>S</b>elf-validating · <b>T</b>imely." },
  { deck:"testing", cat:"Unit Testing", q:"A test uses <code>LocalDate.now()</code> and fails in CI on weekdays. Which FIRST principle is violated?", a:"<b>Repeatable</b> — the result depends on when it runs. Fix: use a fixed date like <code>LocalDate.of(2024,1,6)</code> or inject a controllable clock." },
  { deck:"testing", cat:"Unit Testing", q:"What kinds of defects are unit tests best at catching?", a:"Common developer errors: flow-control failures, improper logic, wrong variables, malformed environment variables, misconfigured properties." },
  { deck:"testing", cat:"TDD/BDD", q:"What is TDD and its cycle?", a:"<b>Test-Driven Development</b>: write tests first, then code to pass them. Cycle: <b>Red → Green → Refactor</b> (failing test → minimal code to pass → clean up)." },
  { deck:"testing", cat:"TDD/BDD", q:"TDD vs BDD?", a:"<b>TDD</b>: code-level tests written first by developers. <b>BDD</b>: behavior described in business-readable <b>Given/When/Then</b> (Gherkin, Cucumber) so non-technical stakeholders participate." },
  { deck:"testing", cat:"JUnit 5", q:"@BeforeEach vs @BeforeAll?", a:"<code>@BeforeEach</code> runs before <b>every</b> test (fresh state). <code>@BeforeAll</code> runs <b>once</b> before all tests, must be <b>static</b> — for expensive shared setup." },
  { deck:"testing", cat:"JUnit 5", q:"JUnit lifecycle execution order?", a:"<code>@BeforeAll</code> → (<code>@BeforeEach</code> → <code>@Test</code> → <code>@AfterEach</code>) × N tests → <code>@AfterAll</code>." },
  { deck:"testing", cat:"JUnit 5", q:"JUnit 4 equivalents of @BeforeEach, @BeforeAll, @Disabled?", a:"<code>@Before</code>, <code>@BeforeClass</code>, <code>@Ignore</code>. (After side: <code>@After</code>/<code>@AfterClass</code> ↔ <code>@AfterEach</code>/<code>@AfterAll</code>.)" },
  { deck:"testing", cat:"JUnit 5", q:"By default, when does a JUnit @Test method pass?", a:"When it completes <b>without throwing an unhandled exception</b> — which is why assertions are needed to actually validate behavior." },
  { deck:"testing", cat:"JUnit 5", q:"In <code>assertEquals(a, b)</code>, which argument is which?", a:"<b>Expected first, actual second</b>: <code>assertEquals(expected, actual)</code>. Swapping them makes failure messages misleading." },
  { deck:"testing", cat:"JUnit 5", q:"How do you test that code throws an exception in JUnit?", a:"<code>assertThrows(MyException.class, () -&gt; code())</code> — returns the exception so you can assert on its message. (Older style: try/catch + <code>fail()</code> at the end of try.)" },
  { deck:"testing", cat:"JUnit 5", q:"What does assertAll() do?", a:"Runs <b>all</b> grouped assertions and reports <b>every</b> failure instead of stopping at the first — JUnit's soft assertion." },
  { deck:"testing", cat:"JUnit 5", q:"Hard vs soft asserts?", a:"<b>Hard</b>: test stops at the first failed assertion (plain <code>assertEquals</code>). <b>Soft</b>: all assertions run and failures are reported together (<code>assertAll</code>)." },
  { deck:"testing", cat:"JUnit 5", q:"How do you run one test method against many data sets?", a:"<code>@ParameterizedTest</code> with a source: <code>@ValueSource(ints={2,4})</code>, <code>@CsvSource({\"10,true\"})</code>, or <code>@CsvFileSource</code> — the basis of data-driven testing. JUnit 4: <code>@RunWith(Parameterized.class)</code>." },
  { deck:"testing", cat:"JUnit 5", q:"How do you skip a test and why might you?", a:"<code>@Disabled(\"reason\")</code> (JUnit 5) / <code>@Ignore</code> (JUnit 4) on the method or class — for broken tests, unfinished refactoring, or obsolete cases." },
  { deck:"testing", cat:"JUnit 5", q:"What is a test suite?", a:"A container class that groups related test classes to run together — JUnit 4: <code>@RunWith(Suite.class)</code> + <code>@Suite.SuiteClasses({...})</code>." },
  { deck:"testing", cat:"Mockito", q:"Mock vs Stub?", a:"<b>Mock</b>: the fake object that can stub methods and verify interactions. <b>Stub</b>: a method programmed to return a predefined result (<code>when...thenReturn</code>)." },
  { deck:"testing", cat:"Mockito", q:"Mock vs Spy in Mockito?", a:"<b>Mock</b>: complete fake — unstubbed methods return defaults (null/0/false/empty). <b>Spy</b>: wraps a <b>real object</b> — unstubbed methods run the real implementation." },
  { deck:"testing", cat:"Mockito", q:"How do you stub a return value and an exception?", a:"<code>when(mock.method(args)).thenReturn(value)</code> and <code>when(mock.method(args)).thenThrow(new RuntimeException())</code>. Void methods: <code>doNothing().when(mock).voidMethod()</code>." },
  { deck:"testing", cat:"Mockito", q:"You stubbed <code>greet(\"Ted\")</code> but the test calls <code>greet(\"Bob\")</code>. What happens?", a:"The stub does NOT fire — Mockito tracks arguments, so the call returns the <b>default value</b> for the return type. Use matchers (<code>anyString()</code>) to loosen matching." },
  { deck:"testing", cat:"Mockito", q:"What do @Mock and @InjectMocks do?", a:"<code>@Mock</code> creates the fake dependency; <code>@InjectMocks</code> creates the real object under test and injects the mocks into it — trying <b>constructor → setter → field</b> injection." },
  { deck:"testing", cat:"Mockito", q:"How do you enable Mockito annotations in JUnit 5?", a:"<code>@ExtendWith(MockitoExtension.class)</code> on the class (or call <code>MockitoAnnotations.openMocks(this)</code> in setup)." },
  { deck:"testing", cat:"Mockito", q:"How do you verify a method was called exactly twice? Never?", a:"<code>verify(mock, times(2)).method(args)</code> · <code>verify(mock, never()).method(args)</code>. Also <code>atLeast(n)</code> / <code>atMost(n)</code>. Plain <code>verify(mock).method()</code> = exactly once." },
  { deck:"testing", cat:"Mockito", q:"Why use verify() when you already assert the result?", a:"Assertions check the <b>result</b>; verify checks the <b>path of execution</b> — e.g., that input validation or a save call really happened on the dependency." },
  { deck:"testing", cat:"Regression", q:"Regression testing vs re-testing?", a:"<b>Regression</b>: re-run existing tests after new code to catch broken old features (novel defects). <b>Re-testing</b>: re-run previously <b>failed</b> tests after a fix to confirm the defect is resolved (known defects)." },
  { deck:"testing", cat:"pytest", q:"Main differences: pytest vs unittest?", a:"pytest uses plain <code>assert</code>, auto-discovery, optional classes, flexible <b>fixtures</b>, rich plugins. unittest needs <code>TestCase</code> classes, <code>self.assertEqual()</code>, rigid setUp/tearDown." },
  { deck:"testing", cat:"pytest", q:"What is a pytest fixture?", a:"Setup/teardown via <b>dependency injection</b>: <code>@pytest.fixture</code> function whose name a test takes as a parameter. <code>yield</code> hands over the value; code after yield is teardown (runs even on failure)." },
  { deck:"testing", cat:"pytest", q:"Name the four pytest fixture scopes.", a:"<code>function</code> (default, per test) · <code>class</code> · <code>module</code> · <code>session</code> (once per run — expensive resources like DB engines)." },
  { deck:"testing", cat:"pytest", q:"Efficient fixture strategy for 1000 DB tests?", a:"<b>Session-scoped</b> engine + schema creation (once) + <b>function-scoped</b> transaction <b>rolled back</b> after each test — isolation without 1000 schema creations." },
  { deck:"testing", cat:"pytest", q:"Where do shared fixtures live?", a:"<code>conftest.py</code> — pytest auto-discovers it; fixtures there are available to all tests in that directory tree without imports." },
  { deck:"testing", cat:"pytest", q:"How do you parameterize a pytest test?", a:"<code>@pytest.mark.parametrize(\"n,expected\", [(2,True),(3,False)])</code> — the test runs once per tuple." },
  { deck:"testing", cat:"pytest", q:"How do you skip tests in pytest?", a:"<code>@pytest.mark.skip(reason=...)</code>, conditional <code>@pytest.mark.skipif(cond, reason=...)</code>, or <code>@pytest.mark.xfail</code> for expected failures." },
  { deck:"testing", cat:"unittest", q:"Basic structure of a unittest test?", a:"Class extends <code>unittest.TestCase</code>; methods named <code>test_*</code>; <code>setUp()</code>/<code>tearDown()</code> per test; asserts like <code>self.assertEqual()</code>; run via <code>unittest.main()</code>." },
  { deck:"testing", cat:"unittest", q:"unittest equivalents of @BeforeEach and @BeforeAll?", a:"<code>setUp(self)</code> per test, and <code>setUpClass(cls)</code> (a <code>@classmethod</code>) once per class." },
  { deck:"testing", cat:"Python Mock", q:"Mock vs MagicMock?", a:"<b>MagicMock</b> = Mock + pre-configured <b>magic methods</b> (<code>__len__, __iter__, __getitem__</code>…). <code>len(Mock())</code> → TypeError; <code>len(MagicMock())</code> → 0. Default to MagicMock." },
  { deck:"testing", cat:"Python Mock", q:"How do you stub a return value on a Python mock?", a:"<code>m.get_user.return_value = {\"name\": \"John\"}</code> — every call to <code>m.get_user()</code> now returns that dict." },
  { deck:"testing", cat:"Python Mock", q:"Three things side_effect can do that return_value can't?", a:"1) <b>Raise</b> an exception, 2) return a <b>sequence</b> of values on successive calls (list), 3) <b>compute</b> the result from arguments (function)." },
  { deck:"testing", cat:"Python Mock", q:"How do you verify calls on a Python mock?", a:"<code>m.assert_called_once_with(args)</code>, <code>m.assert_called_with(args)</code>, <code>m.assert_not_called()</code>; inspect <code>m.called</code> / <code>m.call_count</code>." },
  { deck:"testing", cat:"Patching", q:"The golden rule of @patch?", a:"Patch where the object is <b>used</b>, not where it's defined — <code>from lib import client</code> creates a local reference in your module, so patch <code>mymodule.client</code>, not <code>lib.client</code>." },
  { deck:"testing", cat:"Patching", q:"Two ways to apply patch()?", a:"Decorator: <code>@patch(\"mymodule.api\")</code> (mock injected as test argument, stacked decorators inject <b>bottom-up</b>) or context manager: <code>with patch(\"mymodule.api\") as m:</code>." },
  { deck:"testing", cat:"Patching", q:"What does pytest-mock give you?", a:"The <code>mocker</code> fixture — <code>mocker.patch(\"mymodule.api\")</code> with <b>automatic cleanup</b> after the test; no decorator stacking or with-blocks." },
  { deck:"testing", cat:"Allure", q:"Allure results vs Allure report?", a:"<b>Results</b>: raw JSON written by the test run (<code>allure-results/</code>). <b>Report</b>: interactive HTML generated from them (<code>allure-report/</code>)." },
  { deck:"testing", cat:"Allure", q:"allure serve vs allure generate?", a:"<code>serve</code>: temp local server + browser — quick local review. <code>generate ... -o allure-report --clean</code>: static HTML — right for <b>CI/CD</b> (archive as artifact, publish to Pages)." },
  { deck:"testing", cat:"Allure", q:"How do you produce Allure results from pytest?", a:"<code>pip install allure-pytest</code> then <code>pytest --alluredir=allure-results</code>." },
  { deck:"testing", cat:"Allure", q:"Name Allure features beyond pass/fail counts.", a:"<b>Steps</b> (<code>@allure.step</code>/with-blocks), <b>attachments</b> (screenshots, logs), <b>links</b> (Jira/TMS), <b>severity</b>, <b>categories</b> (product defect vs test defect vs infrastructure vs flaky), trend graphs, timeline, BDD behaviors." },
  { deck:"testing", cat:"Acceptance", q:"Alpha vs beta testing?", a:"<b>Alpha</b>: first acceptance round by <b>internal</b> personnel (not testers). <b>Beta</b>: limited release to <b>external</b> end users for real-world feedback." },
  { deck:"testing", cat:"Acceptance", q:"What does Operational Acceptance Testing (OAT) cover?", a:"Admin/auxiliary concerns: backups, log generation, install/uninstall processes, and security vulnerabilities." },
  { deck:"testing", cat:"Acceptance", q:"Smoke vs sanity testing?", a:"<b>Smoke</b>: critical-path health check of the whole build, run first. <b>Sanity</b>: focused regression subset on a specific new feature/fix." },
  { deck:"testing", cat:"Non-Functional", q:"Load vs stress vs endurance testing?", a:"<b>Load</b>: performance under <i>varying</i> traffic. <b>Stress</b>: increase load until the <i>breaking point</i>. <b>Endurance (soak)</b>: <i>normal</i> load over a long time — finds memory leaks and log bloat." },
  { deck:"testing", cat:"Non-Functional", q:"What does performance testing measure and what agreement is it tied to?", a:"<b>Responsiveness</b> (how fast it responds) and <b>throughput</b> (how much it processes per unit time) — validating <b>SLA</b> commitments." },
  { deck:"testing", cat:"Test Team", q:"Why should testers be independent of developers?", a:"Testers assume the app <i>has</i> defects (pessimistic); developers assume it works (optimistic). Independence removes bias and improves defect detection — but quality is everyone's job." },
  { deck:"testing", cat:"Test Docs", q:"Test plan vs test strategy?", a:"<b>Plan</b>: master document — objectives, schedule, estimates, deliverables. <b>Strategy</b>: the component describing testing <i>approaches/techniques</i> and effort estimates." },
  { deck:"testing", cat:"Test Docs", q:"Test progress report vs test summary report?", a:"<b>Progress</b>: ongoing status during testing (executed/passed/failed/defects). <b>Summary</b>: aggregated results per run/cycle, compared against <b>exit criteria</b> at milestones." },
  { deck:"testing", cat:"STLC", q:"Name the STLC phases in order.", a:"<b>Requirement Analysis → Test Planning → Test Case Development (∥ Environment Setup) → Test Execution → Test Cycle Closure</b>." },
];

let deck = "all";
let cards = [];
let idx = 0;
let known = new Set();
let review = new Set();

function activeCards() {
  return CARDS.filter(c => deck === "all" || c.deck === deck);
}

function loadDeck() {
  cards = activeCards().slice();
  idx = 0;
  known.clear();
  review.clear();
  updateCounts();
  render();
}

function render() {
  if (cards.length === 0) return;
  const c = cards[idx];
  document.getElementById("frontContent").innerHTML = c.q;
  document.getElementById("backContent").innerHTML = c.a;
  document.getElementById("frontCategory").textContent = c.cat;
  document.getElementById("backCategory").textContent = c.cat;
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("status").textContent = `Card ${idx + 1} of ${cards.length}`;
  document.getElementById("progressFill").style.width = ((idx + 1) / cards.length * 100) + "%";
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === cards.length - 1;
  document.getElementById("ratingBtns").style.display = "none";
}

function flip() {
  const card = document.getElementById("card");
  card.classList.toggle("flipped");
  if (card.classList.contains("flipped")) {
    document.getElementById("ratingBtns").style.display = "flex";
  }
}

function next() {
  if (idx < cards.length - 1) { idx++; render(); }
}
function prev() {
  if (idx > 0) { idx--; render(); }
}
function rate(r) {
  const c = cards[idx];
  const key = c.q;
  if (r === "good") { known.add(key); review.delete(key); }
  else { review.add(key); known.delete(key); }
  updateCounts();
  if (idx < cards.length - 1) { idx++; render(); }
}
function updateCounts() {
  document.getElementById("knownCount").textContent = known.size;
  document.getElementById("reviewCount").textContent = review.size;
}

document.getElementById("card").addEventListener("click", flip);
document.getElementById("shuffleBtn").addEventListener("click", () => {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  idx = 0;
  render();
});
document.getElementById("resetBtn").addEventListener("click", loadDeck);
document.querySelectorAll(".deck-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".deck-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    deck = btn.dataset.deck;
    loadDeck();
  });
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.code === "ArrowLeft") prev();
  else if (e.code === "ArrowRight") next();
  else if (e.key === "1") rate("again");
  else if (e.key === "2") rate("good");
});

loadDeck();
</script>
